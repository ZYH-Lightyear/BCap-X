<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">RoboMEx State-Grounded Agent Swarm Architecture</title>
  <desc id="desc">A paper-style architecture diagram showing an event-conditioned embodied agent swarm, its graph and runtime substrate, and a case where a dropped object triggers monitoring, verification, interruption, and suffix replanning.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/>
      <stop offset="1" stop-color="#F2F5FA"/>
    </linearGradient>
    <linearGradient id="swarmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF4FF"/>
      <stop offset="1" stop-color="#F7F3FF"/>
    </linearGradient>
    <linearGradient id="caseBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3874D8"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC5963"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D9D78"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 31px; font-weight: 760; letter-spacing: -0.4px; }
      .subtitle { font-size: 16px; fill: #5B677A; }
      .panel-title { font-size: 20px; font-weight: 760; }
      .section-kicker { font-size: 12px; font-weight: 760; letter-spacing: 1.5px; }
      .card-title { font-size: 17px; font-weight: 730; }
      .body { font-size: 14px; fill: #46546A; }
      .small { font-size: 12px; fill: #617087; }
      .tiny { font-size: 11px; fill: #718096; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .white { fill: #FFFFFF; }
      .blue { fill: #285FB8; }
      .red { fill: #C4424E; }
      .green { fill: #187A5B; }
      .muted { fill: #677489; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="url(#pageBg)"/>
  <text x="54" y="53" class="title">RoboMEx: State-Grounded Agent Swarms for Closed-Loop Code-as-Policy</text>
  <text x="54" y="84" class="subtitle">Swarm decides who observes, codes, challenges, verifies, and replans; graph compiles those commitments into safe execution.</text>
  <g transform="translate(1532,42)">
    <rect x="0" y="0" width="213" height="36" rx="18" fill="#E7EEF9"/>
    <circle cx="21" cy="18" r="6" fill="#4F79C8"/>
    <text x="35" y="23" font-size="13" font-weight="700" fill="#365B99">METHOD ≠ GRAPH</text>
  </g>

  <!-- Left: architecture -->
  <g>
    <rect x="40" y="112" width="1110" height="938" rx="24" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1.5"/>
  </g>
  <text x="72" y="151" class="panel-title">A. Architecture: Agent Swarm is the policy layer</text>

  <!-- Agent swarm zone -->
  <rect x="70" y="174" width="1050" height="432" rx="20" fill="url(#swarmBg)" stroke="#BFD0EE" stroke-width="1.5"/>
  <text x="94" y="202" class="section-kicker blue">AGENT SWARM · 论文方法主体</text>
  <text x="895" y="202" class="small" text-anchor="end">event-conditioned team formation</text>

  <!-- Manager -->
  <g>
    <rect x="400" y="220" width="390" height="88" rx="16" fill="#3F70C7"/>
  </g>
  <circle cx="435" cy="252" r="15" fill="#FFFFFF" opacity="0.20"/>
  <path d="M428 252 l5 5 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="462" y="251" class="card-title white">Swarm Manager</text>
  <text x="462" y="274" font-size="13" fill="#EAF1FF">recruit · assign · challenge · reorganize</text>
  <text x="595" y="294" font-size="11" fill="#DCE8FF" text-anchor="middle">does not write robot state or execute motion</text>

  <!-- Manager routing lines behind agents -->
  <path d="M460 308 C400 326, 300 326, 220 347" fill="none" stroke="#7596D0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M535 308 C505 326, 490 330, 470 347" fill="none" stroke="#7596D0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M655 308 C685 326, 700 330, 720 347" fill="none" stroke="#7596D0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M730 308 C790 326, 890 326, 970 347" fill="none" stroke="#7596D0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Four role cards -->
  <g>
    <rect x="98" y="348" width="230" height="104" rx="14" fill="#FFFFFF" stroke="#79A6D5" stroke-width="1.5"/>
  </g>
  <circle cx="123" cy="374" r="10" fill="#4D8FC6"/>
  <text x="142" y="380" class="card-title">Grounding</text>
  <text x="116" y="408" class="body">Geometry / affordance evidence</text>
  <text x="116" y="432" class="small">on-demand specialist</text>

  <g>
    <rect x="348" y="348" width="230" height="104" rx="14" fill="#FFFFFF" stroke="#8874CE" stroke-width="1.5"/>
  </g>
  <circle cx="373" cy="374" r="10" fill="#765BC5"/>
  <text x="392" y="380" class="card-title">Coder Agent</text>
  <text x="366" y="408" class="body">write · run · repair local code</text>
  <text x="366" y="432" class="small mono">Completed / Unable</text>

  <g>
    <rect x="598" y="348" width="230" height="104" rx="14" fill="#FFFFFF" stroke="#3DA892" stroke-width="1.5"/>
  </g>
  <circle cx="623" cy="374" r="10" fill="#269B82"/>
  <text x="642" y="380" class="card-title">Sentinel Monitor</text>
  <text x="616" y="408" class="body">watch active physical invariant</text>
  <text x="616" y="432" class="small">asynchronous · read-only</text>

  <g>
    <rect x="848" y="348" width="230" height="104" rx="14" fill="#FFFFFF" stroke="#E19A49" stroke-width="1.5"/>
  </g>
  <circle cx="873" cy="374" r="10" fill="#D8872E"/>
  <text x="892" y="380" class="card-title">Verifier Agent</text>
  <text x="866" y="408" class="body">independent targeted review</text>
  <text x="866" y="432" class="small mono">Passed / Failed / Uncertain</text>

  <!-- Role to bus arrows -->
  <path d="M213 452 L213 482" stroke="#8090A8" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <path d="M463 452 L463 482" stroke="#8090A8" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <path d="M713 452 L713 482" stroke="#8090A8" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <path d="M963 452 L963 482" stroke="#8090A8" stroke-width="1.8" marker-end="url(#arrowGray)"/>

  <!-- Minimal message plane -->
  <rect x="98" y="486" width="980" height="88" rx="14" fill="#FFFFFF" stroke="#C9D5E7" stroke-width="1.5"/>
  <text x="120" y="514" class="card-title">Grounded Belief + Minimal Swarm Protocol</text>
  <g transform="translate(120,530)">
    <rect x="0" y="0" width="210" height="28" rx="14" fill="#E9F1FE"/>
    <text x="105" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#365F9D">TaskTicket</text>
    <rect x="231" y="0" width="210" height="28" rx="14" fill="#E8F7F3"/>
    <text x="336" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#247865">SwarmEvent</text>
    <rect x="462" y="0" width="210" height="28" rx="14" fill="#FFF2E4"/>
    <text x="567" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#A46225">FrontierSnapshot</text>
    <text x="700" y="19" class="small">contract-sliced views only</text>
  </g>

  <!-- Thin downward compile flow -->
  <path d="M595 606 L595 629" stroke="#64748B" stroke-width="2.4" marker-end="url(#arrowGray)"/>
  <rect x="474" y="609" width="242" height="24" rx="12" fill="#F0F3F8"/>
  <text x="595" y="626" text-anchor="middle" class="tiny" font-weight="700">compile joint commitments</text>

  <!-- Graph IR zone -->
  <rect x="70" y="640" width="1050" height="145" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="94" y="668" class="section-kicker muted">COMPILED CONTROL GRAPH · 实现 IR，不是方法贡献</text>
  <text x="1088" y="668" class="small" text-anchor="end">executed prefix immutable · replace pending suffix only</text>

  <g transform="translate(103,700)">
    <rect x="0" y="0" width="135" height="48" rx="12" fill="#E8EEF7" stroke="#AAB8CB"/>
    <text x="68" y="30" text-anchor="middle" font-size="14" font-weight="700">Ground</text>
    <path d="M138 24 L180 24" stroke="#728197" stroke-width="2" marker-end="url(#arrowGray)"/>
    <rect x="184" y="0" width="135" height="48" rx="12" fill="#E8EEF7" stroke="#AAB8CB"/>
    <text x="252" y="30" text-anchor="middle" font-size="14" font-weight="700">Grasp</text>
    <path d="M322 24 L364 24" stroke="#728197" stroke-width="2" marker-end="url(#arrowGray)"/>
    <rect x="368" y="0" width="160" height="48" rx="12" fill="#EAF7F3" stroke="#54A792" stroke-width="1.5"/>
    <text x="448" y="30" text-anchor="middle" font-size="14" font-weight="700">Transport</text>
    <path d="M531 24 L573 24" stroke="#728197" stroke-width="2" marker-end="url(#arrowGray)"/>
    <rect x="577" y="0" width="135" height="48" rx="12" fill="#FFF8EB" stroke="#D6B06A"/>
    <text x="645" y="30" text-anchor="middle" font-size="14" font-weight="700">Release</text>
    <path d="M715 24 L757 24" stroke="#728197" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
    <rect x="761" y="0" width="175" height="48" rx="12" fill="#F1EDFB" stroke="#9A87CE"/>
    <text x="849" y="21" text-anchor="middle" font-size="13" font-weight="700">Pending suffix</text>
    <text x="849" y="38" text-anchor="middle" class="tiny">replace after reconcile</text>
    <rect x="390" y="56" width="116" height="25" rx="12" fill="#DDF4EE"/>
    <text x="448" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#287963">Monitor attached</text>
    <path d="M448 55 L448 49" stroke="#269B82" stroke-width="2" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Runtime zone -->
  <rect x="70" y="805" width="1050" height="88" rx="16" fill="#EFF3F8" stroke="#C5D0DE" stroke-width="1.5"/>
  <text x="94" y="832" class="section-kicker muted">RUNTIME SUBSTRATE · 确定性、安全、非 Agent</text>
  <g transform="translate(94,847)">
    <text x="0" y="20" class="body">Observation stream</text>
    <circle cx="159" cy="15" r="3" fill="#94A3B8"/>
    <text x="176" y="20" class="body">ActionHandle + safe-boundary preemption</text>
    <circle cx="472" cy="15" r="3" fill="#94A3B8"/>
    <text x="489" y="20" class="body">single-writer belief reducer</text>
    <circle cx="718" cy="15" r="3" fill="#94A3B8"/>
    <text x="735" y="20" class="body">motion lease + receipts</text>
  </g>

  <!-- API / world -->
  <rect x="70" y="912" width="1050" height="58" rx="14" fill="#F5F0FB" stroke="#D3C6E7" stroke-width="1.5"/>
  <text x="94" y="947" class="section-kicker" fill="#6E58A4">CAP-X APIs + SKILLS · local action vocabulary</text>
  <text x="1086" y="947" class="body" text-anchor="end">motion · gripper · perception · learned / evolved skills</text>
  <path d="M595 970 L595 987" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="70" y="992" width="1050" height="38" rx="12" fill="#24354E"/>
  <text x="595" y="1017" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">ROBOT + CHANGING PHYSICAL WORLD</text>

  <!-- Observation feedback loop -->
  <path d="M88 1010 C30 1008, 34 530, 88 530" fill="none" stroke="#2E9D82" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
  <rect x="41" y="727" width="92" height="25" rx="12" fill="#E0F3EE" transform="rotate(-90 87 739)"/>
  <text x="48" y="744" class="tiny" font-weight="700" fill="#287963" transform="rotate(-90 87 739)">live evidence</text>

  <!-- Right: case -->
  <g>
    <rect x="1180" y="112" width="580" height="938" rx="24" fill="url(#caseBg)" stroke="#DCE3EE" stroke-width="1.5"/>
  </g>
  <text x="1212" y="151" class="panel-title">B. Case: Drop during Transport（搬运中掉落）</text>
  <text x="1212" y="177" class="small">One generic invariant violation, not a hand-written “drop rule”.</text>

  <!-- Case vertical spine -->
  <line x1="1236" y1="218" x2="1236" y2="947" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Step 1 -->
  <circle cx="1236" cy="232" r="17" fill="#3F70C7"/>
  <text x="1236" y="238" text-anchor="middle" font-size="13" font-weight="750" fill="#FFFFFF">1</text>
  <g>
    <rect x="1272" y="202" width="450" height="92" rx="14" fill="#FFFFFF" stroke="#B9CBE8"/>
  </g>
  <text x="1292" y="228" class="card-title">Skill declares a physical contract</text>
  <rect x="1292" y="242" width="389" height="31" rx="8" fill="#EDF3FC"/>
  <text x="1307" y="263" class="mono" font-size="13" font-weight="700" fill="#365F9D">maintains attached(can, gripper)</text>

  <!-- Step 2 -->
  <circle cx="1236" cy="344" r="17" fill="#765BC5"/>
  <text x="1236" y="350" text-anchor="middle" font-size="13" font-weight="750" fill="#FFFFFF">2</text>
  <g>
    <rect x="1272" y="314" width="450" height="102" rx="14" fill="#FFFFFF" stroke="#CFC5E7"/>
  </g>
  <text x="1292" y="340" class="card-title">Coder and Monitor run concurrently</text>
  <text x="1292" y="365" class="body">Coder executes transport via Cap-X APIs.</text>
  <text x="1292" y="390" class="body">Sentinel watches only the active invariant.</text>
  <path d="M1635 352 v22" stroke="#8C99AB" stroke-width="4" stroke-linecap="round"/>
  <path d="M1623 374 q12 11 24 0" fill="none" stroke="#8C99AB" stroke-width="4" stroke-linecap="round"/>
  <rect x="1629" y="381" width="12" height="25" rx="5" fill="#E0A349"/>

  <!-- Step 3 -->
  <circle cx="1236" cy="470" r="17" fill="#269B82"/>
  <text x="1236" y="476" text-anchor="middle" font-size="13" font-weight="750" fill="#FFFFFF">3</text>
  <g>
    <rect x="1272" y="440" width="450" height="100" rx="14" fill="#FFFFFF" stroke="#9FD4C8"/>
  </g>
  <text x="1292" y="466" class="card-title">World changes → semantic event</text>
  <rect x="1292" y="480" width="166" height="31" rx="8" fill="#E8F7F3"/>
  <text x="1307" y="501" class="mono" font-size="12" font-weight="700" fill="#247865">Monitor: Suspected</text>
  <path d="M1473 496 L1508 496" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="1518" y="480" width="176" height="31" rx="8" fill="#FFF2E4"/>
  <text x="1533" y="501" class="mono" font-size="12" font-weight="700" fill="#A46225">Verifier: Violated</text>
  <text x="1292" y="528" class="tiny">independent evidence prevents self-confirmation</text>

  <!-- Step 4 -->
  <circle cx="1236" cy="596" r="17" fill="#D65A65"/>
  <text x="1236" y="602" text-anchor="middle" font-size="13" font-weight="750" fill="#FFFFFF">4</text>
  <g>
    <rect x="1272" y="560" width="450" height="105" rx="14" fill="#FFF9F9" stroke="#E4A6AC"/>
  </g>
  <text x="1292" y="588" class="card-title">Runtime interrupts safely</text>
  <text x="1292" y="613" class="body">Pause at primitive / waypoint boundary.</text>
  <rect x="1292" y="626" width="292" height="25" rx="8" fill="#FBE8EA"/>
  <text x="1307" y="644" class="mono" font-size="12" font-weight="700" fill="#B6424D">ActionReceipt: Interrupted</text>
  <text x="1601" y="644" class="tiny">then reconcile belief</text>

  <!-- Step 5 -->
  <circle cx="1236" cy="724" r="17" fill="#3F70C7"/>
  <text x="1236" y="730" text-anchor="middle" font-size="13" font-weight="750" fill="#FFFFFF">5</text>
  <g>
    <rect x="1272" y="690" width="450" height="105" rx="14" fill="#FFFFFF" stroke="#B9CBE8"/>
  </g>
  <text x="1292" y="718" class="card-title">Swarm reorganizes around the new state</text>
  <text x="1292" y="744" class="body">Manager invalidates only the pending suffix.</text>
  <text x="1292" y="769" class="body">Recruit Grounding + Grasp specialists on demand.</text>

  <!-- Step 6 -->
  <circle cx="1236" cy="860" r="17" fill="#2D9D78"/>
  <text x="1236" y="866" text-anchor="middle" font-size="13" font-weight="750" fill="#FFFFFF">6</text>
  <g>
    <rect x="1272" y="820" width="450" height="146" rx="14" fill="#F7FCFA" stroke="#8DCAB9" stroke-width="1.5"/>
  </g>
  <text x="1292" y="848" class="card-title">Compile a new unfinished suffix</text>
  <g transform="translate(1292,868)">
    <rect x="0" y="0" width="84" height="38" rx="10" fill="#E1F2ED"/>
    <text x="42" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#247865">Relocalize</text>
    <path d="M88 19 L112 19" stroke="#2D9D78" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="116" y="0" width="76" height="38" rx="10" fill="#E1F2ED"/>
    <text x="154" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#247865">Regrasp</text>
    <path d="M196 19 L220 19" stroke="#2D9D78" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="224" y="0" width="86" height="38" rx="10" fill="#E1F2ED"/>
    <text x="267" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#247865">Transport</text>
    <path d="M314 19 L338 19" stroke="#2D9D78" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="342" y="0" width="78" height="38" rx="10" fill="#E1F2ED"/>
    <text x="381" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#247865">Release</text>
  </g>
  <text x="1292" y="934" class="small">Executed prefix remains immutable; resume closed loop.</text>

  <!-- Bottom claim -->
  <rect x="1212" y="988" width="516" height="38" rx="12" fill="#253650"/>
  <text x="1470" y="1012" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Physical event → evidence → team change → policy repair</text>
</svg>
