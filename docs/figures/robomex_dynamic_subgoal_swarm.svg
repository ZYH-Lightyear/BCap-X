<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">RoboMEx Dynamic Subgoal-Centered Agent Swarm</title>
  <desc id="desc">A high-level architecture diagram. A task planner emits an embodied subgoal. A Swarm Manager dynamically recruits coding agents and compiles their commitments into a graph. The graph is only the runtime carrier for agent lifecycle, typed dataflow, and safe physical action order. Live evidence and semantic events feed back to the Manager, which may reorganize the pending swarm and graph.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/>
      <stop offset="1" stop-color="#F1F5FA"/>
    </linearGradient>
    <linearGradient id="swarmBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF4FF"/>
      <stop offset="0.52" stop-color="#F5F1FF"/>
      <stop offset="1" stop-color="#ECF8F4"/>
    </linearGradient>
    <linearGradient id="managerBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3568C0"/>
      <stop offset="1" stop-color="#5A65C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#14213A" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#14213A" flood-opacity="0.08"/>
    </filter>

    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#3E70C8"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#718096"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#249477"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#D9822B"/>
    </marker>

    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 31px; font-weight: 760; letter-spacing: -0.4px; fill: #172238; }
      .subtitle { font-size: 16px; fill: #5D6A7E; }
      .kicker { font-size: 12px; font-weight: 760; letter-spacing: 1.4px; }
      .box-title { font-size: 17px; font-weight: 740; fill: #172238; }
      .card-title { font-size: 16px; font-weight: 730; fill: #172238; }
      .body { font-size: 13px; fill: #47566C; }
      .small { font-size: 11.5px; fill: #68778D; }
      .tiny { font-size: 10.5px; fill: #758398; }
      .white { fill: #FFFFFF; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#background)"/>

  <!-- Header -->
  <text id="diagram-title" x="52" y="53" class="title">RoboMEx: Dynamic Subgoal-Centered Agent Swarm</text>
  <text x="52" y="83" class="subtitle">Manager 组织智能体；Graph 只承载生命周期、数据流与安全物理执行顺序。</text>
  <g transform="translate(1258,39)">
    <rect width="290" height="38" rx="19" fill="#E6F4EF" stroke="#B8DED2"/>
    <circle cx="21" cy="19" r="6" fill="#269879"/>
    <text x="38" y="24" font-size="12" font-weight="740" fill="#26745F">SWARM = POLICY · GRAPH = RUNTIME IR</text>
  </g>

  <!-- Closed-loop evidence path, drawn behind the architecture -->
  <path d="M1354 944 L1354 995 L26 995 L26 112 L848 112 L848 135"
        fill="none" stroke="#249477" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrowGreen)"/>
  <g transform="translate(12,572) rotate(-90)">
    <rect x="0" y="0" width="302" height="27" rx="13.5" fill="#E5F5F0"/>
    <text x="151" y="18" text-anchor="middle" font-size="11" font-weight="720" fill="#24765F">live evidence · Completed · Unable · Anomaly</text>
  </g>

  <!-- Top: task to subgoal to manager -->
  <g>
    <rect x="66" y="151" width="225" height="105" rx="16" fill="#263A58"/>
  </g>
  <text x="179" y="181" text-anchor="middle" font-size="17" font-weight="740" class="white">Task Planner</text>
  <text x="179" y="207" text-anchor="middle" font-size="12.5" fill="#D9E4F2">task + scene + history</text>
  <text x="179" y="229" text-anchor="middle" font-size="12.5" fill="#D9E4F2">→ next embodied subgoal</text>

  <path d="M294 204 L339 204" fill="none" stroke="#718096" stroke-width="2.2" marker-end="url(#arrowGray)"/>

  <g>
    <rect x="346" y="151" width="244" height="105" rx="16" fill="#FFFFFF" stroke="#9FB7DC" stroke-width="1.5"/>
  </g>
  <text x="468" y="180" text-anchor="middle" class="box-title">Subgoal Ticket</text>
  <text x="468" y="206" text-anchor="middle" class="body">目标 · 约束 · 可观测成功条件</text>
  <rect x="378" y="220" width="180" height="22" rx="11" fill="#EAF1FC"/>
  <text x="468" y="235" text-anchor="middle" class="tiny mono">goal / entities / postcondition</text>

  <path d="M594 204 L638 204" fill="none" stroke="#3E70C8" stroke-width="2.4" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="646" y="135" width="420" height="137" rx="19" fill="url(#managerBackground)"/>
  </g>
  <circle cx="683" cy="174" r="16" fill="#FFFFFF" opacity="0.20"/>
  <path d="M675 174 l6 6 l11 -14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="711" y="174" font-size="19" font-weight="760" class="white">Subgoal Swarm Manager</text>
  <text x="711" y="199" font-size="13" fill="#E7EDFF">recruit · assign · challenge · suspend · retire</text>
  <line x1="676" y1="216" x2="1038" y2="216" stroke="#FFFFFF" opacity="0.22"/>
  <text x="856" y="238" text-anchor="middle" font-size="11.5" fill="#E1E9FF">仅在 Subgoal 边界或语义事件时重组，不介入每个控制帧</text>
  <text x="856" y="256" text-anchor="middle" font-size="10.5" fill="#D2DEFA">Completed → Planner · Unable / Anomaly → reorganize pending work</text>

  <path d="M1168 204 L1074 204" fill="none" stroke="#7259BE" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="1175" y="151" width="357" height="105" rx="16" fill="#F5F1FD" stroke="#B8A7DC" stroke-width="1.5"/>
  </g>
  <text x="1354" y="180" text-anchor="middle" class="box-title">Skill + Agent Registry</text>
  <text x="1354" y="206" text-anchor="middle" class="body">skills · specialist contracts · models · tools</text>
  <rect x="1241" y="220" width="226" height="22" rx="11" fill="#EAE3FA"/>
  <text x="1354" y="235" text-anchor="middle" class="tiny">按需检索，不把整库塞进 prompt</text>

  <!-- Manager to active swarm -->
  <path d="M856 272 L856 312" fill="none" stroke="#3E70C8" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <rect x="754" y="287" width="204" height="22" rx="11" fill="#E8EFFB"/>
  <text x="856" y="302" text-anchor="middle" class="tiny" font-weight="720" fill="#365F9D">form a team for this Subgoal</text>

  <!-- Active swarm -->
  <rect x="66" y="326" width="1466" height="251" rx="21" fill="url(#swarmBackground)" stroke="#B9CAEA" stroke-width="1.5"/>
  <text x="90" y="355" class="kicker" fill="#315FAD">ACTIVE AGENT SWARM · 每个 SUBGOAL / 事件都可以不同</text>
  <text x="1505" y="355" text-anchor="end" class="small">Coding Agents retrieve Skills, write/run local code, and publish typed results</text>

  <!-- Swarm card 1 -->
  <g>
    <rect x="100" y="379" width="316" height="147" rx="16" fill="#FFFFFF" stroke="#74A8D7" stroke-width="1.5"/>
  </g>
  <circle cx="130" cy="410" r="11" fill="#4D91C9"/>
  <path d="M124 410 h12 M130 404 v12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="153" y="416" class="card-title">Grounding / Tracking</text>
  <text x="121" y="447" class="body">定位实体，维护 identity 与几何状态</text>
  <text x="121" y="470" class="small">可跨节点长期存活，持续发布新证据</text>
  <rect x="121" y="488" width="104" height="24" rx="12" fill="#E7F2FA"/>
  <text x="173" y="505" text-anchor="middle" class="tiny" font-weight="720" fill="#3475A7">LONG-LIVED</text>

  <!-- Swarm card 2 -->
  <g>
    <rect x="448" y="379" width="316" height="147" rx="16" fill="#FFFFFF" stroke="#9074D0" stroke-width="1.5"/>
  </g>
  <circle cx="478" cy="410" r="11" fill="#7759C7"/>
  <path d="M473 405 l10 10 M483 405 l-10 10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="501" y="416" class="card-title">Affordance / Motion</text>
  <text x="469" y="447" class="body">按需生成 1…K 个局部代码与方案</text>
  <text x="469" y="470" class="small">IK · collision · render / replay · repair</text>
  <rect x="469" y="488" width="112" height="24" rx="12" fill="#EFE9FB"/>
  <text x="525" y="505" text-anchor="middle" class="tiny" font-weight="720" fill="#684CAF">ON-DEMAND</text>

  <!-- Swarm card 3 -->
  <g>
    <rect x="796" y="379" width="316" height="147" rx="16" fill="#FFFFFF" stroke="#4FAF98" stroke-width="1.5"/>
  </g>
  <circle cx="826" cy="410" r="11" fill="#269B82"/>
  <path d="M820 410 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="849" y="416" class="card-title">Monitor Sidecar</text>
  <text x="817" y="447" class="body">并行检查当前动作的物理 invariant</text>
  <text x="817" y="470" class="small">异常时产生事件，并请求安全停止</text>
  <rect x="817" y="488" width="94" height="24" rx="12" fill="#E5F5F0"/>
  <text x="864" y="505" text-anchor="middle" class="tiny" font-weight="720" fill="#24765F">PARALLEL</text>

  <!-- Swarm card 4 -->
  <g>
    <rect x="1144" y="379" width="348" height="147" rx="16" fill="#FFFFFF" stroke="#DF9145" stroke-width="1.5"/>
  </g>
  <circle cx="1174" cy="410" r="11" fill="#D8872E"/>
  <path d="M1168 410 h12 M1174 404 v12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="1197" y="416" class="card-title">Verifier / Recovery</text>
  <text x="1165" y="447" class="body">独立判断结果，诊断失败类型</text>
  <text x="1165" y="470" class="small">提出 repair、替代 Agent 或 suffix replan</text>
  <rect x="1165" y="488" width="118" height="24" rx="12" fill="#FFF0E1"/>
  <text x="1224" y="505" text-anchor="middle" class="tiny" font-weight="720" fill="#A76325">EVENT-DRIVEN</text>

  <rect x="362" y="540" width="874" height="25" rx="12.5" fill="#FFFFFF" stroke="#CAD6E8"/>
  <text x="799" y="557" text-anchor="middle" font-size="11" font-weight="690" fill="#53647C">Agents 决定“如何完成”；结果以 typed commitments 进入 Graph，而不是靠自然语言抄写数值</text>

  <!-- Swarm to graph -->
  <path d="M799 577 L799 612" fill="none" stroke="#3E70C8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="690" y="588" width="218" height="22" rx="11" fill="#E8EFFB"/>
  <text x="799" y="603" text-anchor="middle" class="tiny" font-weight="720" fill="#365F9D">compile / patch pending suffix</text>

  <!-- Graph runtime -->
  <rect x="66" y="621" width="1466" height="172" rx="21" fill="#FFFFFF" stroke="#C7D1DF" stroke-width="1.6"/>
  <text x="90" y="650" class="kicker" fill="#65748A">COMPILED EXECUTION GRAPH · 实现载体，不是策略主体</text>
  <text x="1505" y="650" text-anchor="end" class="small">executed prefix immutable · only pending work may be replaced</text>

  <rect x="100" y="670" width="410" height="91" rx="15" fill="#EEF3FA" stroke="#B8C6D8"/>
  <circle cx="129" cy="697" r="10" fill="#7188A7"/>
  <text x="150" y="703" class="card-title">Agent Lifecycle</text>
  <text x="121" y="731" class="body">spawn · activate · suspend · resume · retire</text>
  <text x="121" y="751" class="small">明确每个 SubAgent 何时存在、由谁拥有</text>

  <rect x="595" y="670" width="410" height="91" rx="15" fill="#EDF7F4" stroke="#A9D1C5"/>
  <circle cx="624" cy="697" r="10" fill="#3D9D83"/>
  <text x="645" y="703" class="card-title">Typed Dataflow</text>
  <text x="616" y="731" class="body">artifacts · evidence · provenance · freshness</text>
  <text x="616" y="751" class="small">关键数值通过 typed ports，不穿过语言通道</text>

  <rect x="1090" y="670" width="410" height="91" rx="15" fill="#FFF5E9" stroke="#E1BE8C"/>
  <circle cx="1119" cy="697" r="10" fill="#D8872E"/>
  <text x="1140" y="703" class="card-title">Physical Order + Authority</text>
  <text x="1111" y="731" class="body">observe → propose → gate → execute → verify</text>
  <text x="1111" y="751" class="small">多个 Agent 可探索，但只有一个物理写入者</text>

  <!-- Graph to execution -->
  <path d="M799 793 L799 824" fill="none" stroke="#718096" stroke-width="2.4" marker-end="url(#arrowGray)"/>

  <!-- Physical execution lane -->
  <g>
    <rect x="82" y="835" width="288" height="105" rx="17" fill="#F5F1FD" stroke="#B6A5DC" stroke-width="1.5"/>
  </g>
  <text x="226" y="865" text-anchor="middle" class="box-title">0…K Read-only Trials</text>
  <text x="226" y="891" text-anchor="middle" class="body">code · IK · point cloud replay</text>
  <text x="226" y="914" text-anchor="middle" class="small">没有真实世界写权限</text>

  <path d="M374 887 L441 887" fill="none" stroke="#7259BE" stroke-width="2.4" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="449" y="835" width="278" height="105" rx="17" fill="#FFFFFF" stroke="#9EAFCA" stroke-width="1.5"/>
  </g>
  <text x="588" y="865" text-anchor="middle" class="box-title">Promotion Gate</text>
  <text x="588" y="891" text-anchor="middle" class="body">证据与约束选择一个方案</text>
  <text x="588" y="914" text-anchor="middle" class="small">或全部拒绝并返回 Manager</text>

  <path d="M731 887 L798 887" fill="none" stroke="#D9822B" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <g>
    <rect x="806" y="835" width="288" height="105" rx="17" fill="#FFF0E2" stroke="#D9822B" stroke-width="1.8"/>
  </g>
  <text x="950" y="865" text-anchor="middle" class="box-title">Single Physical Writer</text>
  <text x="950" y="891" text-anchor="middle" class="body">执行被选中的 sealed action</text>
  <text x="950" y="914" text-anchor="middle" class="small">Monitor 可中断；receipt 不可伪造</text>

  <path d="M1098 887 L1165 887" fill="none" stroke="#D9822B" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <g>
    <rect x="1173" y="835" width="359" height="105" rx="17" fill="#263A58"/>
  </g>
  <text x="1353" y="869" text-anchor="middle" font-size="18" font-weight="750" class="white">ROBOT + PHYSICAL WORLD</text>
  <text x="1353" y="896" text-anchor="middle" font-size="12.5" fill="#D9E4F2">changing geometry · uncertainty · failures</text>
  <rect x="1246" y="909" width="214" height="21" rx="10.5" fill="#314A6D"/>
  <text x="1353" y="924" text-anchor="middle" font-size="10.5" fill="#E2EBF7">new evidence closes the loop</text>

  <!-- Footer value statement -->
  <rect x="377" y="1011" width="846" height="28" rx="14" fill="#E8EFF9" stroke="#C6D3E5"/>
  <text x="800" y="1030" text-anchor="middle" font-size="12" font-weight="730" fill="#3D587E">核心价值：Swarm 提供适应性；Graph 把适应性编译成可审计、可恢复且安全的物理执行。</text>
</svg>
