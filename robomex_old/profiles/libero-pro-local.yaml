schema_version: robomex.runtime_profile.v1
profile_id: libero-pro-local
environment_config: ../../env_configs/libero/franka_libero_cap_agent0.yaml
execution_mode: live
privileged_policy: false
skill_roots: []

models:
  planner: vapi/claude-opus-4-8
  manager: vapi/claude-opus-4-8
  coding_agent: vapi/qwen3.5-27b
  vlm: vapi/gpt-5.5
  server_url: http://localhost:8110/chat/completions

swarm:
  motion_candidates: 3
  coding_max_turns: 6
  coding_max_model_calls: 32
  coding_max_tokens: 262144
  coding_max_wall_time_ms: 120000

episode:
  max_actions: 32
  max_planner_calls: 40
  output_root: ../../outputs/robomex_libero_live

safety:
  world_id: libero
  arm_resource: robot.arm
  gripper_resource: robot.gripper
  controller_resource: robot.controller
  tcp_frame_id: panda_hand_tcp
  # Coding/渲染发生在同一个 revision 上，可能持续数十秒；physical admission
  # 仍会比较 authoritative revision/digest，墙钟门限只用于拒绝真正陈旧的证据。
  max_snapshot_age_s: 180.0
  max_gripper_width_m: 0.08
  collision_validation: curobo_exact_path
