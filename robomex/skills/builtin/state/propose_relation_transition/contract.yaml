skill_id: propose_relation_transition
tags: [state, relation, proposal, v2]
role: state_proposal_author
changes_world: false
capabilities: [artifact_write]
forbidden_capabilities: [perception_read, geometry_compute, simulation_probe, active_perception, robot_motion, gripper_control, object_manipulation]
input_ports:
  - {name: observation, schema: robomex.bowl_place_observation.v1, frame: world}
  - {name: relation_evidence, schema: robomex.relation_evidence.v1}
  - {name: verdict, schema: robomex.placement_verdict.v1}
output_ports:
  - {name: proposal, schema: robomex.state_transition_proposal.v1}
postconditions: [one strict supported_by proposal is emitted and no state is committed]
budget: {max_turns: 3, max_model_calls: 3, max_tokens: 64000, max_wall_time_ms: 60000}
exit_conditions:
  success: "Published one evidence-bound supported_by relation proposal."
  stale_observation: "Observation, verdict, relation evidence, or base state revision is inconsistent."
  failed_placement: "The independent placement verdict does not assert success."
  wrong_grounding: "Subject, target, or track identity differs across final evidence."
functions:
  - name: build_relation_transition_proposal
    entry: "scripts/relation_transition.py:build_relation_transition_proposal"
    description: "Cross-check final evidence/verdict and construct the exact reducer wire schema with causal refs."
