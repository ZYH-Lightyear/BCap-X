skill_id: estimate_support_alignment
tags: [affordance, alignment, visual_servo, v2]
role: geometry_estimator
changes_world: false
capabilities: [perception_read, geometry_compute, artifact_write]
forbidden_capabilities: [simulation_probe, active_perception, robot_motion, gripper_control, object_manipulation]
input_ports:
  - {name: observation, schema: robomex.bowl_place_observation.v1, frame: world}
  - {name: attachment_evidence, schema: robomex.attachment_evidence.v1}
output_ports:
  - {name: held_bowl, schema: robomex.held_bowl_estimate.v1, frame: world, required: false}
  - {name: plate_target, schema: robomex.plate_support_target.v1, frame: world, required: false}
  - {name: alignment_error, schema: robomex.alignment_error.v1, frame: world}
postconditions: [alignment is measured from one synchronized checkpoint without choosing an action]
budget: {max_turns: 3, max_model_calls: 3, max_tokens: 64000, max_wall_time_ms: 60000}
exit_conditions:
  success: "Published synchronized held geometry, target geometry when requested, and measured alignment error."
  stale_observation: "Observation and attachment evidence do not share one snapshot and camera revision."
  wrong_grounding: "The admitted bowl or plate identity does not match the checkpoint envelope."
  uncertain: "Either tracked geometry is not visible in the admitted checkpoint."
functions:
  - name: estimate_support_alignment
    entry: "scripts/support_alignment.py:estimate_support_alignment"
    description: "Validate synchronized identities/revisions and compute target-minus-held translation, yaw, containment, and uncertainty."
