# environment config with CaP-Agent0 settings
# Usage:
#   uv run capx/envs/launch.py --config-path env_configs/libero/franka_libero_cap_agent0.yaml

env:
  _target_: capx.envs.tasks.franka.franka_libero_env.FrankaLiberoCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero.FrankaLiberoEnv
      suite_name: libero_object_swap
      task_id: 0
      privileged: false
      max_steps: 8000
      control_freq: 20
    privileged: false
    apis:
      - FrankaLiberoApiReducedSkillLibrary
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: {libero_environment_goal}
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

robomex:
  models:
    # Outer task decomposition and dynamic swarm composition use the stronger model.
    planner: vapi/claude-opus-4-8
    manager: vapi/claude-opus-4-8
    # Leaf Grounding / Affordance / Motion / Action / Verifier Coding Agents.
    subagent: vapi/qwen3.5-27b
  vlm:
    # Dedicated VLM used by query_vlm / vlm_bbox_detection / vlm_point_detection inside
    # RoboMEx code blocks. Keep this separate from text-agent role models so
    # Planner/Manager/SubAgents can change without changing visual grounding.
    model: vapi/gpt-5.5
    server_url: http://localhost:8110/chat/completions
    coord_space: pixel
  runtime:
    # RoboMEx agent runtime knobs live in config instead of being hidden in code.
    # Dynamic swarm is the main path. Use universal for a one-Coding-Agent baseline.
    authoring_strategy: dynamic_swarm
    max_subgoals: 8
    # Default leaf Coding SubAgent budget; Creator has a separate orchestration budget.
    subagent_max_turns: 8
    swarm_manager_max_turns: 4
    swarm_capability_ceiling:
      - perception_read
      - artifact_write
      - geometry_compute
      - simulation_probe
      - active_perception
      - robot_motion
      - object_manipulation
      - gripper_control
    scene_camera: agentview
    act_observation_camera: agentview
    prompt_api_names:
      - get_observation
      - goto_pose
      - open_gripper
      - close_gripper
      - move_to_joints
      - goto_home_joint_position
      - solve_ik
      - query_vlm
      - decompose_transform
      - rotation_matrix_to_quaternion
      - transform_points
      - pixel_to_world_point
      - mask_to_world_points
      - depth_to_point_cloud
      - normalize_vector
      - vlm_bbox_detection
      - vlm_point_detection
      - segment_sam3_text_prompt
      - segment_sam3_point_prompt
      - segment_sam3_box_prompt
      - plan_grasp
      - plan_grasp_from_point_clouds
      - get_oriented_bounding_box_from_3d_points
      - subsample_point_cloud
      - filter_noise
api_servers:
  - _target_: capx.serving.openrouter_server.main
    routes_file: configs/services/llm_routes.json
    host: 127.0.0.1
    port: 8110

  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
    # Local SAM3 weights. Leave unset to auto-discover <repo>/checkpoints/sam3/sam3.pt,
    # then fall back to a HuggingFace download if no local checkpoint exists.
    checkpoint_path: ./checkpoints/sam3/sam3.pt

record_video: true
output_dir: ./outputs/franka_libero_cap_agent0
use_img_differencing: true
use_parallel_ensemble: true
use_multimodel: true

trials: 50
num_workers: 3
